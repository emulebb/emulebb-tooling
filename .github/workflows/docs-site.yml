name: Documentation Site

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/docs-site.yml'
      - 'docs/**'
      - 'helpers/public-presence.py'
      - 'manifests/public-presence.v1.json'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/docs-item-taxonomy-check.py'
      - 'scripts/docs-structure-check.py'
      - 'scripts/github-roadmap-check.py'
  pull_request:
    paths:
      - '.github/workflows/docs-site.yml'
      - 'docs/**'
      - 'helpers/public-presence.py'
      - 'manifests/public-presence.v1.json'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/docs-item-taxonomy-check.py'
      - 'scripts/docs-structure-check.py'
      - 'scripts/github-roadmap-check.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    name: Build documentation site
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
      NO_MKDOCS_2_WARNING: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Run documentation checks
        run: |
          python helpers/public-presence.py validate
          python scripts/docs-item-taxonomy-check.py
          python scripts/docs-structure-check.py
          python scripts/github-roadmap-check.py

      - name: Build MkDocs site
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-output
        run: >-
          python -m mkdocs build --strict
          --site-dir "${{ env.EMULEBB_WORKSPACE_OUTPUT_ROOT }}/artifacts/docs/emulebb-tooling-site"

      - name: Configure GitHub Pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/emulebb-output/artifacts/docs/emulebb-tooling-site

  deploy:
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    name: Deploy documentation site
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
