name: Branch checks
on:
  workflow_call:
    inputs:
      tooling_ref:
        required: true
        type: string
      repo_kind:
        required: true
        type: string
  push:
    branches: ['feature/**', 'fix/**', 'chore/**']
permissions:
  contents: read
concurrency:
  group: branch-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-tooling
          ref: ${{ inputs.tooling_ref || github.sha }}
          path: tooling
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
        working-directory: repo
      - run: python tooling/ci/guard-tracked-files.py --repo-root repo --policy-path repo/manifests/privacy-guard/policy.v1.json
      - run: python tooling/ci/check-basic-hygiene.py --repo-root repo --repo-kind "${{ inputs.repo_kind || 'tooling' }}"
      - run: python -m unittest discover -s ci/tests
        working-directory: tooling
