name: Reusable Baseline

on:
  workflow_call:
    inputs:
      policy_path:
        required: true
        type: string
      repo_kind:
        required: false
        type: string
        default: generic
      extra_step_script:
        required: false
        type: string
        default: ''
      extra_commands:
        required: false
        type: string
        default: ''
      node_version:
        required: false
        type: string
        default: ''
      node_cache_dependency_path:
        required: false
        type: string
        default: ''
      tooling_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  baseline:
    name: baseline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025-vs2026

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: repo

      - name: Checkout emulebb-tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: emulebb/emulebb-tooling
          ref: ${{ inputs.tooling_ref }}
          path: tooling

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15.2"

      - name: Set up Node
        if: ${{ inputs.node_version != '' && inputs.node_cache_dependency_path == '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Set up Node with npm cache
        if: ${{ inputs.node_version != '' && inputs.node_cache_dependency_path != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.node_cache_dependency_path }}

      - name: Run tracked-file privacy guard
        shell: cmd
        run: >
          python tooling\ci\guard-tracked-files.py
          --repo-root "%CD%\repo"
          --policy-path "%CD%\repo\${{ inputs.policy_path }}"
          --summary-path "${{ runner.temp }}\emulebb-output\reports\tracked-file-privacy-guard-summary.json"

      - name: Run basic hygiene checks
        shell: cmd
        run: >
          python tooling\ci\check-basic-hygiene.py
          --repo-root "%CD%\repo"
          --repo-kind "${{ inputs.repo_kind }}"
          --summary-path "${{ runner.temp }}\emulebb-output\reports\basic-hygiene-summary.json"

      - name: Run optional extra step
        if: ${{ inputs.extra_step_script != '' }}
        shell: cmd
        run: >
          call "%CD%\repo\${{ inputs.extra_step_script }}"

      - name: Run optional extra commands
        if: ${{ inputs.extra_commands != '' }}
        shell: pwsh
        working-directory: repo
        run: |
          # Fail the step on any command failure. Without this, pwsh keeps going
          # after a non-zero native command (e.g. a failed `npm run build`) and
          # the step's result is only the LAST command's exit code, so a broken
          # build can be masked by a later passing command and falsely report
          # success.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ${{ inputs.extra_commands }}
