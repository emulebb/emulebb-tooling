name: Baseline

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline:
    uses: ./.github/workflows/reusable-baseline.yml
    with:
      policy_path: manifests/privacy-guard/policy.v1.json
      repo_kind: tooling
      tooling_ref: ci/v8
