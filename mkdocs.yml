      - Product Direction: active/PRODUCT-DIRECTION.md
      - Quality Gates: active/QUALITY-GATES.md
      - Test Strategy: active/TEST-STRATEGY.md
      - REST API Contract Lineage: active/API-V1-COMPATIBILITY.md
      - Roadmap Board (GitHub): https://github.com/orgs/emulebb/projects/3
