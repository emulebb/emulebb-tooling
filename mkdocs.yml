      - Legacy Item Catalog: history/LEGACY-ITEM-CATALOG.md
      - Source Lineage Changelog: history/HISTORY-CHANGELOG.md
      - 0.70b vs 0.72a: history/HISTORY-070-VS-072.md
not_in_nav: |
  /reference/ed2k-inventory/AGENTS.md
  /rest/REST-API-OPENAPI.yaml
  /products/emulebb-rust/active/items/**
  /products/emulebb-rust/history/items/**

exclude_docs: |
  products/emulebb-rust/history/items/*
  !products/emulebb-rust/history/items/INDEX.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
