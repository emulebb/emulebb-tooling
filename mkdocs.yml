      - Controllers And REST: reference/GUIDE-CONTROLLERS-REST.md
      - emulebb-mfc Frozen OpenAPI: products/emulebb-mfc/api/REST-API-OPENAPI.yaml
      - Rust Forward OpenAPI: products/emulebb-rust/api/REST-API-OPENAPI.yaml
