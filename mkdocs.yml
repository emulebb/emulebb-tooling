site_name: eMuleBB Suite Documentation
site_description: eMuleBB Suite — eD2K/Kad and BitTorrent clients, controller, REST, integration, and release documentation.
site_url: https://emulebb.github.io/emulebb-tooling/
repo_url: https://github.com/emulebb/emulebb-tooling
edit_uri: blob/main/docs/
docs_dir: docs
site_dir: .local/mkdocs-site

theme:
  name: material
  language: en
  logo: assets/brand/emulebb-mkdocs-logo.png
  favicon: assets/brand/emulebb-mkdocs-logo.png
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow

extra_css:
  - assets/mkdocs.css

extra:
  analytics:
    provider: google
    property: G-8G02C2WFEB

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

plugins:
  - search

