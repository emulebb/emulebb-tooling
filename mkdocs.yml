site_name: eMuleBB Documentation
site_description: eMuleBB user, integration, release, and REST documentation.
site_url: https://emulebb.github.io/emulebb-tooling/
repo_url: https://github.com/emulebb/emulebb-tooling
edit_uri: blob/main/docs/
docs_dir: docs
site_dir: .local/mkdocs-site

theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow

extra_css:
  - assets/mkdocs.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: INDEX.md
  - Quick Help: HELP.md
  - User Guides:
      - Product Guide: reference/GUIDE-EMULEBB.md
      - Roadmap Summary: reference/ROADMAP-SUMMARY.md
      - Power User Manual: reference/GUIDE-POWER-USERS.md
      - Setup Guide: reference/GUIDE-SETUP.md
      - Downloads And Search: reference/GUIDE-DOWNLOADS-SEARCH.md
      - Sharing Guide: reference/GUIDE-SHARING.md
      - Network Guide: reference/GUIDE-NETWORK.md
      - Stack Integrations: reference/GUIDE-STACK-INTEGRATIONS.md
      - Controllers And REST: reference/GUIDE-CONTROLLERS-REST.md
      - Preferences Guide: reference/GUIDE-PREFERENCES.md
      - Persistence Files: reference/GUIDE-PERSISTENCE-FILES.md
      - IP Filters: reference/GUIDE-IP-FILTERS.md
      - Long Paths: reference/GUIDE-LONGPATHS.md
      - Keyboard Shortcuts: reference/KEYBOARD-SHORTCUTS.md
      - Troubleshooting: reference/GUIDE-TROUBLESHOOTING.md
      - Translations: reference/GUIDE-TRANSLATIONS.md
  - API And Automation:
      - REST Quickstart: rest/REST-API-QUICKSTART.md
      - REST Contract: rest/REST-API-CONTRACT.md
      - Adapter Notes: rest/REST-API-ADAPTERS.md
      - OpenAPI Contract: rest/REST-API-OPENAPI.yaml
      - Parity Inventory: rest/REST-API-PARITY-INVENTORY.md
      - Controller Surface Matrix: active/CONTROLLER-SURFACE-MATRIX.md
  - Active Release:
      - Backlog Index: active/INDEX.md
      - Release 0.7.3: active/RELEASE-0.7.3.md
      - Release Notes: active/RELEASE-0.7.3-NOTES.md
      - Current Execution Plan: active/plans/RELEASE-0.7.3-EXECUTION-PLAN.md
      - Release Checklist: active/RELEASE-0.7.3-CHECKLIST.md
      - Release Runbook: active/RELEASE-0.7.3-RUNBOOK.md
      - Release Test Strategy: active/RELEASE-TEST-STRATEGY.md
      - Release Test Campaigns: active/RELEASE-TEST-CAMPAIGNS.md
      - Frozen Surfaces: active/FROZEN-SURFACES.md
      - Future Roadmap: active/FUTURE-ROADMAP.md
  - Developer And Workspace:
      - Workspace Policy: WORKSPACE-POLICY.md
      - Documentation Policy: DOCS-POLICY.md
      - Agent Checklist: reference/AGENT-CHECKLIST.md
      - Backlog Process: reference/BACKLOG-PROCESS.md
      - Evidence Retention: reference/EVIDENCE-RETENTION.md
      - Workspace Repository Map: reference/WORKSPACE-REPO-MAP.md
      - Development Guide: reference/DEVELOPMENT-GUIDE.md
      - CI Baseline: reference/CI-BASELINE.md
      - Release Branching And Packaging: reference/RELEASE-BRANCHING-AND-PACKAGING.md
      - eD2K Inventory: reference/ED2K-PROJECT-INVENTORY.md
  - Dependencies:
      - Status: dependencies/DEP-STATUS.md
  - Ideas:
      - aMule Watchlist: ideas/IDEA-AMULE-WATCHLIST.md
      - Kad Protocol Modernization: ideas/IDEA-KAD-PROTOCOL-MODERNIZATION.md
      - IPv6 Kad Network: ideas/IDEA-IPV6-KAD-NETWORK.md
      - Modernization: ideas/IDEA-MODERNIZATION-2026.md
      - Restructure: ideas/IDEA-RESTRUCTURE.md
  - History:
      - Historical References: HISTORICAL-REFERENCES.md
      - Abandoned Boost / POCO Adoption: history/ideas/IDEA-BOOST.md
      - Abandoned CMake / Ninja / vcpkg Adoption: history/ideas/IDEA-CMAKE.md

not_in_nav: |
  /active/items/**
  /architecture/**
  /audits/**
  /history/**
  /rest/REST-API-OPENAPI.yaml

validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: info
    anchors: info
    unrecognized_links: info
