site_name: eMuleBB Documentation
site_description: Documentation for the eMuleBB Rust active beta, maintained Windows client, and eMuleBB engineering workspace.
site_url: https://emulebb.github.io/emulebb-tooling/
repo_url: https://github.com/emulebb/emulebb-tooling
edit_uri: blob/main/docs/
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    scheme: slate
    primary: black
    accent: teal
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow

extra_css:
  - assets/mkdocs.css

extra:
  analytics:
    provider: google
    property: G-8G02C2WFEB

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - redirects:
      redirect_maps:
        active/PRODUCT-PORTFOLIO.md: active/PRODUCT-DIRECTION.md
        reference/ROADMAP-SUMMARY.md: active/PRODUCT-DIRECTION.md
        active/FUTURE-ROADMAP.md: active/PRODUCT-DIRECTION.md
        HISTORICAL-REFERENCES.md: history/INDEX.md
        active/RELEASE-0.7.3.md: history/releases/0.7.3/RELEASE-0.7.3-PROOF-SUMMARY.md
        active/RELEASE-0.7.3-NOTES.md: history/releases/0.7.3/RELEASE-0.7.3-NOTES.md
        active/RELEASE-0.7.3-STABLE-CHANGELOG.md: history/releases/0.7.3/RELEASE-0.7.3-STABLE-CHANGELOG.md
        active/RELEASE-0.7.3-RC2-CHANGELOG.md: history/releases/0.7.3/RELEASE-0.7.3-STABLE-CHANGELOG.md
        active/RELEASE-0.7.3-RC3-CHANGELOG.md: history/releases/0.7.3/RELEASE-0.7.3-STABLE-CHANGELOG.md
        active/RELEASE-0.7.3-CHECKLIST.md: history/releases/0.7.3/RELEASE-0.7.3-PROOF-SUMMARY.md
        active/RELEASE-0.7.3-RUNBOOK.md: history/releases/0.7.3/RELEASE-0.7.3-PROOF-SUMMARY.md
        active/plans/RELEASE-0.7.3-EXECUTION-PLAN.md: history/releases/0.7.3/RELEASE-0.7.3-PROOF-SUMMARY.md

