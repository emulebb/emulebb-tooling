    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - details
          allOf:
          - if:
              required:
              - code
              properties:
                code:
                  const: PERSISTENCE_COMMITTED
            then:
              properties:
                details:
                  required:
                  - committed
                  properties:
                    committed:
                      const: true
          - if:
              required:
              - code
              properties:
                code:
                  const: SETTINGS_CONFLICT
            then:
              properties:
                details:
                  required:
                  - actualRevision
          properties:
            code:
              type: string
              description: Stable machine-readable native REST error code.
              enum:
              - INVALID_ARGUMENT
              - UNAUTHORIZED
              - METHOD_NOT_ALLOWED
              - NOT_FOUND
              - INVALID_STATE
              - DOWNLOAD_CONFLICT
              - CATEGORY_NAME_CONFLICT
              - TAG_NAME_CONFLICT
              - SERVICE_BUSY
              - EMULE_UNAVAILABLE
              - EMULE_ERROR
              - PERSISTENCE_BUSY
              - PERSISTENCE_CLOSING
              - PERSISTENCE_TOO_LARGE
              - PERSISTENCE_FAILED
              - PERSISTENCE_UNAVAILABLE
              - PERSISTENCE_COMMITTED
              - SETTINGS_CONFLICT
              - SETTINGS_REVISION_EXHAUSTED
              - PAYLOAD_TOO_LARGE
            message:
              type: string
              description: Human-readable error summary.
            details:
              type: object
              description: 'Bounded structured diagnostic fields, empty when no details are available. For INVALID_ARGUMENT
                failures on a bounded scalar parameter (such as an out-of-range limit or offset), details carries
                the offending "field" name and a "constraint" string of the form "min..max" (for example {"field":
                "limit", "constraint": "1..1000"}).'
              additionalProperties: true
              properties:
                committed:
                  type: boolean
                  description: Required and true for PERSISTENCE_COMMITTED, otherwise optional. True with that
                    code guarantees the durable mutation committed. It does not guarantee every required downstream
                    sharing publication succeeded. An error HTTP status does not mean that state is unchanged;
                    absence of this marker does not prove that commit failed.
                field:
                  type: string
                  description: Name of the request parameter that failed validation.
                constraint:
                  type: string
                  description: Inclusive numeric bounds the field must satisfy, formatted as "min..max".
                conflicts:
                  description: Present when `code` is `DOWNLOAD_CONFLICT`. Retry only when every entry sets
                    `redownloadAllowed=true`, and only after deliberate user confirmation, by sending `redownload=true`.
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/DownloadConflictEvidence'
                actualRevision:
                  $ref: '#/components/schemas/SettingsRevision'
                  description: Current saved settings revision for SETTINGS_CONFLICT.
                issues:
                  type: array
                  minItems: 1
                  maxItems: 59
                  items:
                    $ref: '#/components/schemas/SettingsValidationIssue'
                  description: Independent canonical setting issues; no submitted values are echoed.
