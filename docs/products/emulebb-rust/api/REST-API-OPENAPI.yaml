          $ref: '#/components/schemas/DownloadMeta'
    DownloadPart:
      type: object
      additionalProperties: false
      required: [index, start, end, sizeBytes, presentBytes, complete, corrupted]
      properties:
        index:
          type: integer
          minimum: 0
        start:
          type: integer
          minimum: 0
          description: Zero-based inclusive start byte offset.
        end:
          type: integer
          minimum: 0
          description: Zero-based inclusive end byte offset.
        sizeBytes:
          type: integer
          minimum: 0
          description: Byte size of this inclusive interval, equal to end - start + 1.
        presentBytes:
          type: integer
          minimum: 0
          description: Checkpointed internal byte presence; this alone does not establish successful verification.
        complete:
          type: boolean
          description: True only after successful part verification, independently of byte presence.
        corrupted:
          type: boolean
    DownloadPartsEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/DownloadPart'
        meta:
          $ref: '#/components/schemas/DownloadPageMeta'
    DownloadSource:
      type: object
      additionalProperties: false
      required:
      - clientId
      - userName
      - userHash
      - address
      - port
      - downloadState
      - clientSoftware
      - reportedFileNames
      - reportedFileNamesHasMore
      - downloadRateBytesPerSecond
      - availableParts
      - partCount
      - serverIp
      - serverPort
      - lowId
      - queueRank
      - viewSharedFiles
      - sharedFilesRequestPending
      properties:
        clientId:
          type: string
        userName:
          type: string
        userHash:
          type:
          - string
          - 'null'
        address:
          type: string
        port:
          type: integer
          minimum: 0
          maximum: 65535
        downloadState:
          type: string
          enum:
          - downloading
          - onqueue
          - connected
          - connecting
          - waitcallback
          - waitcallbackkad
          - reqhashset
          - noneededparts
          - toomanyconns
          - toomanyconnskad
          - lowtolowip
          - banned
          - error
          - none
          - remotequeuefull
          - remembered
          - unknown
        clientSoftware:
          type: string
        reportedFileNames:
          type: array
          maxItems: 16
          description: >-
            Latest observations first, ordered by observedAt and an internal
            stable tie-breaker. The same bounded window is used in source list
            and detail. The projection/page byte budget may reduce the window;
            older observations and raw names exceeding the 65,536-byte
            projection bound are omitted rather than silently rewritten.
          items:
            $ref: '#/components/schemas/DownloadFileNameObservation'
        reportedFileNamesHasMore:
          type: boolean
          description: >-
            True whenever observations are omitted from this latest window,
            including omissions required by the projection/page byte budget.
            No total count or complete-history guarantee is implied.
        downloadRateBytesPerSecond:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        availableParts:
          type: integer
          minimum: 0
        partCount:
          type: integer
          minimum: 0
        serverIp:
          type: string
        serverPort:
          type: integer
          minimum: 0
          maximum: 65535
        lowId:
          type: boolean
        queueRank:
          type: integer
          minimum: 0
        viewSharedFiles:
          type: boolean
        sharedFilesRequestPending:
          type: boolean
    DownloadFileNameObservation:
      type: object
      additionalProperties: false
