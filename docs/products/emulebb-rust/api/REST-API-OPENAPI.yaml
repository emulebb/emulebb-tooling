      - sizeBytes
      - progress
      - intent
      - state
      - waitingReason
      - createdAt
      - updatedAt
      - completedAt
      - payloadVerified
      - delivery
      - failure
      properties:
        id:
          $ref: '#/components/schemas/DownloadId'
        hash:
          type: string
          pattern: ^[0-9a-f]{32}$
          minLength: 32
          maxLength: 32
        name:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/NullableCategory'
        sizeBytes:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 18446744073709551615
        progress:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        intent:
          $ref: '#/components/schemas/DownloadIntent'
        state:
          $ref: '#/components/schemas/DownloadState'
        waitingReason:
          oneOf:
          - $ref: '#/components/schemas/DownloadWaitingReason'
