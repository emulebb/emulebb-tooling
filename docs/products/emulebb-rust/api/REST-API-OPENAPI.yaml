        name:
          type: string
        error:
          type: string
    DownloadId:
      type: string
      minLength: 1
      maxLength: 19
      pattern: ^[1-9][0-9]{0,18}(?![\s\S])
      description: Immutable never-reused job ID, canonical positive decimal in 1..9223372036854775807. The parser enforces the
        numeric bound. Content hash is a separate identity.
      example: '1'
    DownloadState:
      type: string
      enum:
      - queued
      - waiting-metadata
      - downloading
      - stopping
      - stopped
      - verifying
      - delivering
      - completed
      - removing
      - failed
      description: Observed execution state, separate from desired intent and retained terminal completion.
    DownloadWaitingReason:
      type: string
      enum: [network, sources, resources]
      description: >-
        Network cannot operate; no reachable peer currently confirms useful
        missing data; or confirmed useful/local completion work awaits resources.
        Prepared-peer evidence expires with its admission deadline. Retained
        source hints alone do not establish useful reachable work.
    DownloadWaitingState:
      type: object
      required: [state, waitingReason]
      if:
        properties:
          state: {const: queued}
      then:
        properties:
          waitingReason:
            $ref: '#/components/schemas/DownloadWaitingReason'
      else:
        properties:
          waitingReason: {type: 'null'}
    DownloadIntent:
      type: string
      enum:
      - started
      - stopped
    DownloadMeta:
      type: object
      additionalProperties: false
      required:
      - apiVersion
      properties:
        apiVersion:
          type: string
    DownloadPageMeta:
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - nextCursor
      - hasMore
      properties:
        apiVersion:
          type: string
        nextCursor:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 512
        hasMore:
          type: boolean
      allOf:
      - if:
          properties:
            hasMore:
              const: false
        then:
          properties:
            nextCursor:
              type: 'null'
        else:
          properties:
            nextCursor:
              type: string
    DownloadSummary:
