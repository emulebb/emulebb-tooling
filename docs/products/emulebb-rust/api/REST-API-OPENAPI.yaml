      properties:
        id:
          $ref: '#/components/schemas/DownloadId'
        status:
          type: string
          enum:
          - accepted
          - unchanged
          - failed
        httpStatus:
          type: integer
          minimum: 200
          maximum: 599
        error:
          $ref: '#/components/schemas/ErrorEnvelope/properties/error'
      allOf:
      - if:
          properties:
            status:
              const: failed
        then:
          required:
          - error
          properties:
            httpStatus:
              minimum: 400
        else:
          not:
            required:
            - error
          properties:
            httpStatus:
              enum:
              - 200
              - 202
      - if:
          properties:
            status:
              const: unchanged
        then:
          properties:
            httpStatus:
              const: 200
    DownloadEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
