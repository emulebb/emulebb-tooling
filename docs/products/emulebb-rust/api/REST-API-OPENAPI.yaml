  schemas:
    EnvelopeMeta:
      type: object
      additionalProperties: false
      required: [apiVersion]
      properties:
        apiVersion:
          type: string
        generatedAt:
          type: string
          format: date-time
    Ok:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    OkEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Ok"
        meta:
          $ref: "#/components/schemas/EnvelopeMeta"
    PeerBanEnvelope:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PeerBanResult"
    PeerBanResult:
      type: object
      additionalProperties: false
      required: [ok, banned]
      properties:
        ok:
          type: boolean
          const: true
        banned:
          type: boolean
    DiagnosticDumpEnvelope:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DiagnosticDump"
    DiagnosticDump:
      type: object
      additionalProperties: false
      required: [ok, path, fullMemory]
      properties:
        ok:
          type: boolean
          const: true
        path:
          type: string
        fullMemory:
          type: boolean
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
              description: Stable machine-readable native REST error code.
              enum:
                - INVALID_ARGUMENT
                - UNAUTHORIZED
                - METHOD_NOT_ALLOWED
                - NOT_FOUND
                - INVALID_STATE
                - SERVICE_BUSY
                - EMULE_UNAVAILABLE
                - EMULE_ERROR
            message:
              type: string
              description: Human-readable error summary.
            details:
              type: object
              description: >-
                Bounded structured diagnostic fields, empty when no details are
                available. For INVALID_ARGUMENT failures on a bounded scalar
                parameter (such as an out-of-range limit or offset), details
                carries the offending "field" name and a "constraint" string of
                the form "min..max" (for example {"field": "limit", "constraint":
                "1..1000"}).
              additionalProperties: true
              properties:
                field:
                  type: string
                  description: Name of the request parameter that failed validation.
                constraint:
                  type: string
                  description: Inclusive numeric bounds the field must satisfy, formatted as "min..max".
    AppEnvelope:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/App"
    CapabilityDiscoveryEnvelope:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CapabilityDiscovery"
