openapi: 3.1.0
info:
  title: emulebb-rust REST API (forward)
  version: 2.0.0
  x-contract-version: "2.0.0"
  x-contract-baseline: "emulebb-rust forward contract"
  summary: The compatibility-unstable beta /api/v1 contract for emulebb-rust and its embedded WebUI.
  description: >
    Source of truth for the forward emulebb-rust `/api/v1` contract. This is no
    longer a shared emulebb-mfc/Rust superset contract: the emulebb-mfc `0.7.3`
    contract is frozen separately under
    `emulebb-tooling/docs/products/emulebb-mfc/api`, while this document
    evolves with emulebb-rust and its embedded WebUI. During the beta period,
    breaking schema or route changes are allowed when the owned
    Rust surfaces move together; external API stability requires a later freeze
    decision.
    Versioning policy and lineage:
    `emulebb-tooling/docs/active/API-V1-COMPATIBILITY.md`.
    The API uses `X-API-Key` authentication only; adapter compatibility
    (`/api/v2` qBit-compat, Torznab) must not weaken the native route shape.
servers:
  - url: http://{host}:{port}/api/v1
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "20017"
  - url: https://{host}:{port}/api/v1
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "20017"
security:
  - ApiKeyAuth: []
tags:
  - name: App
  - name: Diagnostics
  - name: Stats
  - name: Network
  - name: Nat
  - name: Categories
  - name: Downloads
  - name: SharedFiles
  - name: Library
  - name: Uploads
  - name: Servers
  - name: Kad
  - name: Searches
  - name: Friends
  - name: IpFilter
  - name: VpnGuard
  - name: Logs
paths:
  /app:
    get:
      tags: [App]
      summary: Return application identity, runtime state, and static capabilities.
      operationId: getApp
      responses:
        "200":
          $ref: "#/components/responses/AppResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /capabilities:
    get:
      tags: [App]
      summary: Return contract version and advertised capability tokens.
      operationId: getCapabilities
      responses:
        "200":
          $ref: "#/components/responses/CapabilityDiscoveryResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /events:
    get:
      tags: [App]
      summary: Stream live daemon events.
      description: |
        Server-Sent Events stream for live controller updates. The current stream
        emits lightweight `download.changed`/`download.removed` job-ID notifications
        and `sync.reset` when a subscriber lags or reconnects with `Last-Event-ID`.
        Refresh bounded active download pages/detail and snapshot counts after reset;
        do not reconstruct all historical jobs or retain per-client snapshots.
      operationId: getEvents
      parameters:
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          $ref: "#/components/responses/EventStreamResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /events/status:
    get:
      tags: [App]
      summary: Return live event-stream diagnostics.
      description: >
        Returns the current download-event stream counters and cursor state
        without opening the long-lived Server-Sent Events stream.
      operationId: getEventStatus
      responses:
        "200":
          $ref: "#/components/responses/DownloadEventDiagnosticsResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /settings:
    get:
      tags: [App]
      summary: Return saved settings, admitted effective values and application status.
      operationId: getSettings
      responses:
        "200":
          $ref: "#/components/responses/SettingsResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    patch:
      tags: [App]
      summary: Atomically update selected settings at an expected revision.
      description: |
        `expectedRevision` is the exact `meta.settingsRevision` from the latest settings read.
        `set` supplies typed partial values; `reset` supplies canonical dotted keys.
        An explicit successful write advances the revision, including an unchanged set.
        A stale revision returns HTTP 409 with code SETTINGS_CONFLICT and details.actualRevision.
        Values marked default resolve to the installed defaults at startup without a write.
        Restart-bound changes remain pending. If a mixed live/restart update cannot form a
        valid running configuration, the entire update waits for restart. There is no hidden
        application retry. Requests are bounded to 262144 serialized UTF-8 bytes.
      operationId: patchSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          $ref: "#/components/responses/SettingsResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /settings/surface:
    get:
      tags: [App]
      summary: Return settings surface metadata.
      description: |
        Returns the declaration-derived field catalog, JSON Schemas, bootstrap setting
        names and adjacent resources. Defaults, validation rules and application modes
        share the same Rust declaration as the saved document. Bootstrap values are absent.
      operationId: getSettingsSurface
      responses:
        "200":
          $ref: "#/components/responses/SettingsSurfaceResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /app/shutdown:
    post:
      tags: [App]
      summary: Request clean daemon shutdown.
      operationId: shutdownApp
      description: >
        Requests an orderly stop of the Rust daemon. Host power management is an
        operator or service-manager responsibility, not an application REST
        operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShutdownRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkAcceptedResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /diagnostics:
    get:
      tags: [Diagnostics]
      summary: Return runtime diagnostics.
      description: |
        Power-user diagnostic snapshot for controller dashboards and live-soak
        probes. This is the same `runtimeDiagnostics` object embedded in
        `GET /status`, exposed directly so operators do not need to fetch and
        trim the broader status document.
      operationId: getDiagnostics
      responses:
        "200":
          $ref: "#/components/responses/RuntimeDiagnosticsResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /diagnostics/bundles:
    post:
      tags: [Diagnostics]
      summary: Capture a bounded diagnostic bundle for caller-owned persistence.
      operationId: captureDiagnosticBundle
      description: >
        Unsafe diagnostic endpoint. It requires API-key authorization and an
        explicit confirmation field in the request body. The complete bounded
        bundle is returned inline and is never persisted by the daemon.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticBundleCaptureRequest"
      responses:
        "200":
          $ref: "#/components/responses/DiagnosticBundleResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /diagnostics/crash-tests:
    post:
      tags: [Diagnostics]
      summary: Trigger a diagnostic crash to verify dump generation.
      operationId: triggerDiagnosticCrashTest
      description: >
        Unsafe diagnostic endpoint. It requires API-key authorization and an
        explicit confirmation field in the request body. A successful request
        intentionally terminates the process, so clients should treat connection
        loss after acceptance as the expected result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticCrashTestRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkAcceptedResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /status:
    get:
      tags: [Stats]
      summary: Return current network, transfer, server, and Kad status.
      operationId: getStatus
      responses:
        "200":
          $ref: "#/components/responses/StatusResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /snapshot:
    get:
      tags: [Stats]
      summary: Return a controller dashboard snapshot.
      operationId: getSnapshot
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/SnapshotResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /stats:
    get:
      tags: [Stats]
      summary: Return detailed cumulative and session statistics.
      operationId: getStats
      responses:
        "200":
          $ref: "#/components/responses/StatsResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /network:
    get:
      tags: [Network]
      summary: Return live P2P network binding status.
      operationId: getNetwork
      responses:
        "200":
          $ref: "#/components/responses/NetworkResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /nat:
    get:
      tags: [Nat]
      summary: Return live NAT mapping status.
      operationId: getNat
      responses:
        "200":
          $ref: "#/components/responses/NatResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /nat/operations/refresh:
    post:
      tags: [Nat]
      summary: Refresh live NAT mappings.
      operationId: refreshNat
      description: >
        Runs one live NAT reconcile pass when the ED2K/Kad runtime is active and
        returns the current NAT status. Mapping failures are reported in the
        `lastError` field of the returned status body.
      responses:
        "200":
          $ref: "#/components/responses/NatResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /vpn-guard:
    get:
      tags: [VpnGuard]
      summary: Return live VPN Guard status.
      operationId: getVpnGuard
      responses:
        "200":
          $ref: "#/components/responses/VpnGuardResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /vpn-guard/operations/probe:
    post:
      tags: [VpnGuard]
      summary: Run a bound VPN Guard egress probe.
      operationId: probeVpnGuard
      responses:
        "200":
          $ref: "#/components/responses/VpnGuardResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /categories:
    get:
      tags: [Categories]
      summary: List download categories.
      description: Returns stored categories only; All is a transfer filter, not a category resource.
      operationId: listCategories
      responses:
        "200":
          $ref: "#/components/responses/CategoryListResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Categories]
      summary: Create a download category.
      description: >-
        Creates a category whose immutable name is its public ID. Names follow
        the ASCII tag-name grammar, preserving spelling without trimming or
        rewriting; uniqueness is ASCII case-insensitive. Omitted paths
        default to null and omitted comment defaults to an empty string.
        HTTP 503 PERSISTENCE_COMMITTED
        with details.committed=true guarantees durable mutation and coherent
        authoritative category/assignment caches, while required downstream
        sharing publication may have failed.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateRequest"
      responses:
        "200":
          $ref: "#/components/responses/CategoryResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          description: The category name already exists under ASCII case-insensitive matching; error code CATEGORY_NAME_CONFLICT.
          headers:
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersionHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /categories/{categoryName}:
    parameters:
      - $ref: "#/components/parameters/CategoryName"
    get:
      tags: [Categories]
      summary: Return one download category.
      operationId: getCategory
      responses:
        "200":
          $ref: "#/components/responses/CategoryResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    patch:
      tags: [Categories]
      summary: Update category paths and comment.
      description: >-
        Omitted fields retain their values; explicit null clears a path. The
        category name never changes. HTTP 503
        PERSISTENCE_COMMITTED with details.committed=true reports a durable mutation
        with coherent authoritative caches but failed downstream sharing
        publication.
      operationId: patchCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
      responses:
        "200":
          $ref: "#/components/responses/CategoryResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [Categories]
      summary: Delete one download category.
      description: >-
        Clears only matching transfer category assignments. Surviving category
        names are unchanged; files are neither moved nor deleted.
        HTTP 503 PERSISTENCE_COMMITTED with
        details.committed=true reports a durable mutation with coherent authoritative
        caches but failed downstream sharing publication.
      operationId: deleteCategory
      responses:
        "200":
          $ref: "#/components/responses/OkResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /library/tags:
    get:
      tags:
      - Library
      summary: List tags by ASCII case-insensitive name.
      operationId: listLibraryTags
      responses:
        '200':
          $ref: '#/components/responses/LibraryTagPageResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowedResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/LibraryTagCursor'
      - $ref: '#/components/parameters/LibraryTagLimit'
      description: Default limit 100, maximum 200. Cursors are opaque and scoped to this collection; file
