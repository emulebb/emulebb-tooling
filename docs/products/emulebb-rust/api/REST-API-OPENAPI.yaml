  /searches/{searchId}/results/{resultId}/observations:
    parameters:
    - $ref: '#/components/parameters/SearchId'
    - $ref: '#/components/parameters/SearchResultId'
    get:
      tags:
      - Searches
      summary: Page raw observations for one search result.
      description: Ascending observation-ID keyset traversal, independently bounded
        to 1..200 rows and 256 KiB of charged backing per page. Membership and occurrence
        times/counts are frozen for terminal sessions. Unknown reported values remain
        null. Cursors are scoped to the session and result; traversal is weakly consistent
        under collection changes.
      operationId: listSearchResultObservations
      parameters:
      - $ref: '#/components/parameters/SearchPageLimit'
      - $ref: '#/components/parameters/SearchCursor'
      responses:
        '200':
          $ref: '#/components/responses/SearchObservationPageResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowedResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /searches/{searchId}/results:
    parameters:
    - $ref: '#/components/parameters/SearchId'
    get:
      tags:
      - Searches
      summary: Page globally sorted result summaries.
      description: 'Rows and owned bytes are bounded. Cursors use a retained claim as
        anchor, scoped to this session/sort/direction. Traversal is weakly consistent
        while summaries change: rows can move across the boundary. No per-client snapshots
        or observation expansion.'
      operationId: listSearchResults
      parameters:
      - $ref: '#/components/parameters/SearchPageLimit'
      - $ref: '#/components/parameters/SearchCursor'
      - $ref: '#/components/parameters/SearchSort'
      - $ref: '#/components/parameters/SearchSortOrder'
      responses:
        '200':
          $ref: '#/components/responses/SearchResultPageResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowedResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /searches/{searchId}/results/{resultId}:
    parameters:
    - $ref: '#/components/parameters/SearchId'
    - $ref: '#/components/parameters/SearchResultId'
    get:
      tags:
      - Searches
      summary: Return one materialized result summary.
      operationId: getSearchResult
      responses:
        '200':
          $ref: '#/components/responses/SearchResultResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowedResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  headers:
    ContractVersionHeader:
      description: emulebb-rust `/api/v1` contract version for adapter gating.
      schema:
        type: string
        const: "2.0.0"
        example: "2.0.0"
  parameters:
    LibraryRootId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LibraryRootId'
    LibraryRootLimit:
      required: false
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    LibraryRootCursor:
      required: false
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
      description: Opaque continuation for this root collection.
    SearchCursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation scoped to this collection, session, sort and direction
        where applicable.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    LibraryTagName:
      name: tagName
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LibraryTagName'
      description: Immutable public name. Lookup is ASCII case-insensitive; returned spelling is preserved.
    LibraryTagCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
      description: Opaque collection-scoped live continuation; do not interpret.
    LibraryTagLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    CategoryName:
      name: categoryName
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CategoryName"
      description: Immutable public name; lookup is ASCII case-insensitive and returns saved spelling.
    Confirm:
      name: confirm
      in: query
      required: true
      schema:
        type: boolean
        enum: [true]
      description: Required explicit confirmation for destructive body-free DELETE routes.
    UploadId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?![\s\S])'
      description: Ephemeral queue-entry ID retained through reasks and upload state transitions.
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        pattern: "^([0-9a-f]{32}|[^/]+:(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))$"
      description: Download-source selector, either a lowercase MD4 hash or an endpoint token parsed at the final `address:port` colon.
    FileHash:
      name: hash
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    SharedFileCursor:
      name: cursor
      in: query
      required: false
      description: Server-issued opaque cursor for the next path-ordered page. Clients must preserve the same search and priority filters while following a cursor.
      schema:
        type: string
    SharedFileSearch:
      name: q
      in: query
      required: false
      description: Case-insensitive literal substring of the displayed filename only. The trimmed query must contain at least three Unicode characters; wildcard and query syntax have no special meaning.
      schema:
        type: string
        minLength: 3
    SharedFilePriorityFilter:
      name: priority
      in: query
      required: false
      description: Return only shared files with this upload priority.
      schema:
        $ref: "#/components/schemas/SharedFilePriority"
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    LogsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
        default: 0
    CountTotal:
      name: countTotal
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Include the exact visible waiting count in meta.total.
    UploadQueueLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 100}
    UploadQueueCursor:
      name: cursor
      in: query
      required: false
      description: Opaque live queue continuation. A departed anchor requires refreshing from the first page.
      schema: {type: string, minLength: 1, maxLength: 512}
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: |
        SSE resume cursor from a previous stream. The current daemon does not
        replay historical events. Every stream starts with `sync.reset`:
        reason `initial` without this header, or `reconnect` with it. The opaque
        SSE ID is epoch:revision; its presence never promises replay. Clients
        refresh their bounded active view after reset. The header is not echoed.
      schema:
        type: string
        minLength: 1
    SearchSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
        - displayName
        - sizeBytes
        - sources
        - completeSources
        - rating
        - fileType
        - artist
        - album
        - title
        - lengthSeconds
        - bitrateKbps
        - codec
        default: sources
      description: Global indexed ordering. Claim ID breaks ties in the same direction.
        Text uses binary ordering; unknown size sorts before known size ascending and
        after it descending.
    SearchSortOrder:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
      description: Direction for the selected sort; descending by default.
    SearchPageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    SearchResultId:
      name: resultId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ContentClaimId"
    SearchId:
      name: searchId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SearchId"
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[^/]+:(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})$"
      description: URL-encoded endpoint token parsed at the final `address:port` colon.
    SharedFileIgnorePattern:
      name: pattern
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
      description: File-name glob pattern to remove. Paths are not accepted.
    SharedFileIgnoreRuleKey:
      name: ruleKey
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    UserHash:
      name: userHash
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    DownloadId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DownloadId'
    DownloadView:
      name: view
      in: query
      required: false
      description: Historical completion selects the view, independently of transient verification or delivery observations.
      schema:
        type: string
        enum:
        - unfinished
        - completed
        - all
        default: unfinished
    DownloadCategory:
      name: category
      in: query
      required: false
      description: ASCII case-insensitive category name. Omission selects all categories.
      schema:
        $ref: '#/components/schemas/CategoryName'
    DownloadCursor:
      name: cursor
      in: query
      required: false
      description: Opaque bounded cursor for this resource and selection; do not parse or reuse with different filters.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    DownloadLimit:
      name: limit
      in: query
      required: false
      description: Maximum rows, also subject to the independent response byte bound.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
  responses:
    LibraryRootResponse:
      description: LibraryRootResponse
      headers:
        X-Contract-Version:
          $ref: '#/components/headers/ContractVersionHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryRootEnvelope'
    LibraryRootCreatedResponse:
      description: LibraryRootCreatedResponse
      headers:
        X-Contract-Version:
          $ref: '#/components/headers/ContractVersionHeader'
        Location:
          description: Canonical resource URI.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryRootEnvelope'
    LibraryRootPageResponse:
      description: LibraryRootPageResponse
      headers:
        X-Contract-Version:
          $ref: '#/components/headers/ContractVersionHeader'
