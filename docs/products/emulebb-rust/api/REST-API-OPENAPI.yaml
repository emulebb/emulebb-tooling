  /friends:
    get:
      tags: [Friends]
      summary: List known friends.
      operationId: listFriends
      responses:
        "200":
          $ref: "#/components/responses/FriendListResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
          description: >-
            PERSISTENCE_UNAVAILABLE: the friend read could not be completed by
            the persistence owner. Retry after availability is restored.
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Friends]
      summary: Add a friend by user hash.
      operationId: createFriend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendCreateRequest"
      responses:
        "200":
          $ref: "#/components/responses/FriendResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
          description: >-
            PERSISTENCE_TOO_LARGE: owned persistence work exceeds the admission
            payload budget and is refused before the owner copies it.
        "500":
          $ref: "#/components/responses/ErrorResponse"
          description: PERSISTENCE_FAILED reports a storage failure.
        "503":
          $ref: "#/components/responses/ErrorResponse"
          description: >-
            PERSISTENCE_BUSY or PERSISTENCE_CLOSING rejects admission while the
            owner is saturated or closing. PERSISTENCE_UNAVAILABLE reports a
            worker failure or uncertain commit outcome; do not assume unchanged
            state. PERSISTENCE_COMMITTED with details.committed=true means the
            durable mutation and cache publication completed despite a worker
            fault. Re-read current state before retrying an uncertain outcome.
        default:
          $ref: "#/components/responses/ErrorResponse"
  /friends/{userHash}:
    parameters:
      - $ref: "#/components/parameters/UserHash"
    delete:
      tags: [Friends]
      summary: Remove a friend by user hash.
      operationId: deleteFriend
      responses:
        "200":
