components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  headers:
    ContractVersionHeader:
      description: emulebb-rust `/api/v1` contract version for adapter gating.
      schema:
        type: string
        const: "1.2.0"
        example: "1.2.0"
  parameters:
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 4294967295
    Confirm:
      name: confirm
      in: query
      required: true
      schema:
        type: boolean
        enum: [true]
      description: Required explicit confirmation for destructive body-free DELETE routes.
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        pattern: "^([0-9a-f]{32}|[^/]+:(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))$"
      description: Stable client selector returned by upload or queue rows, either a lowercase MD4 hash or an endpoint token parsed at the final `address:port` colon.
    FileHash:
      name: hash
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    LogsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
        default: 0
    IncludeScoreBreakdown:
      name: includeScoreBreakdown
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Include per-client upload score diagnostics such as cooldown availability and cooldown remaining time.
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: |
        SSE resume cursor from a previous stream. The current daemon does not
        replay historical events; when this header is present, the stream starts
        with a `sync.reset` event carrying the supplied cursor in `lastEventId`
        so clients can re-baseline through `GET /transfers`.
      schema:
        type: string
        minLength: 1
    IncludeEvidence:
      name: includeEvidence
      in: query
      required: false
      schema:
        type: boolean
        default: true
      description: Include the grouped SearchResult.evidence block on each result. Set false to omit the heavy evidence payload when only basic result metadata is needed.
    ExactTotal:
      name: exactTotal
      in: query
      required: false
      schema:
        type: boolean
        default: true
      description: Return an exact result total. Set false to allow `total` to be a lower-bound estimate when computing the exact count is expensive.
    TransferStateFilter:
      name: state
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/TransferState"
    TransferCategoryIdFilter:
      name: categoryId
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 4294967295
    SearchId:
      name: searchId
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 4294967295
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[^/]+:(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})$"
      description: URL-encoded endpoint token parsed at the final `address:port` colon.
    UserHash:
      name: userHash
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
  responses:
    AppResponse:
      description: Application envelope.
      headers:
        X-Contract-Version:
          $ref: "#/components/headers/ContractVersionHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppEnvelope"
    BulkOperationResponse:
      description: Bulk operation envelope.
      headers:
        X-Contract-Version:
          $ref: "#/components/headers/ContractVersionHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BulkOperationEnvelope"
    CapabilityDiscoveryResponse:
      description: Capability discovery envelope.
      headers:
        X-Contract-Version:
          $ref: "#/components/headers/ContractVersionHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CapabilityDiscoveryEnvelope"
    EventStreamResponse:
      description: Server-Sent Events stream. Each `data:` line is a TransferEvent JSON object.
      headers:
        X-Contract-Version:
          $ref: "#/components/headers/ContractVersionHeader"
        Cache-Control:
          description: Prevent intermediaries from caching or transforming the event stream.
          schema:
            type: string
            example: no-cache, no-transform
        X-Accel-Buffering:
          description: Disable reverse-proxy response buffering for live events.
          schema:
            type: string
            example: "no"
      content:
        text/event-stream:
          schema:
            type: string
    TransferEventDiagnosticsResponse:
      description: Transfer event-stream diagnostics envelope.
      headers:
        X-Contract-Version:
          $ref: "#/components/headers/ContractVersionHeader"
      content:
