  schemas:
    LibraryRootId:
      type: string
      minLength: 1
      maxLength: 19
      pattern: ^[1-9][0-9]{0,18}(?![\s\S])
      description: Never-reused positive decimal i64 identity; at most 9223372036854775807.
    LibraryRoot:
      type: object
      additionalProperties: false
      required:
      - path
      - shareable
      - watchEnabled
      - scanRequired
      - accessible
      - id
      - managed
      - lastScannedAt
      description: Cached root resource; use its immutable ID for edits.
      properties:
        path:
          type: string
          description: User-facing root path; Windows verbatim long-path prefixes are not exposed.
        shareable:
          type: boolean
        watchEnabled:
          type: boolean
          description: Whether native file-event watching is enabled for this recursive root; independent
            of sharing eligibility.
        scanRequired:
          type: boolean
          description: Known watcher loss or an observation gap requires an explicit library scan.
            A successful scan clears only loss known before that scan began; no automatic overflow scan is scheduled.
        accessible:
          type: boolean
          description: Last observed accessibility; false until verified, without a fresh probe on GET.
        id:
          $ref: '#/components/schemas/LibraryRootId'
        managed:
          type: boolean
          description: Required by incoming/category settings; cannot be deleted directly.
        lastScannedAt:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Last completed scan as Unix seconds, or null.
    LibraryRootCreateRequest:
      type: object
      additionalProperties: false
      required:
      - path
      properties:
        path:
          type: string
          minLength: 1
          pattern: \S
        watchEnabled:
          type: boolean
          default: false
    LibraryRootPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      required:
      - watchEnabled
      properties:
        watchEnabled:
          type: boolean
    LibraryRootEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/LibraryRoot'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'
    LibraryRootPageEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LibraryRoot'
        meta:
          $ref: '#/components/schemas/CursorPageMeta'
    LibraryScanEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/LibraryScan'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'
    LibraryScanRequest:
      type: object
      additionalProperties: false
      properties: {}
    LibraryScan:
      type: object
      additionalProperties: false
      required:
      - hashingCount
      - reloadProgress
      properties:
        hashingCount:
          type: integer
          minimum: 0
        reloadProgress:
          $ref: '#/components/schemas/SharedDirectoryReloadProgress'
    SearchResultPageEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/SearchResult'
        meta:
          $ref: '#/components/schemas/CursorPageMeta'
    SearchResultEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/SearchResult'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'
    LibraryHashSelection:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items:
        type: string
        pattern: ^[0-9a-f]{32}$
    LibrarySharingRequest:
      type: object
      additionalProperties: false
      required:
      - enabled
      - hashes
      properties:
        enabled:
          type: boolean
        hashes:
          $ref: '#/components/schemas/LibraryHashSelection'
    LibrarySharingBatchItem:
      type: object
      additionalProperties: false
      required:
      - hash
      - status
      - httpStatus
      properties:
        hash:
          type: string
          pattern: ^[0-9a-f]{32}$
        status:
          type: string
          enum:
          - accepted
          - unchanged
          - failed
        httpStatus:
          type: integer
          enum:
          - 200
          - 404
          - 413
          - 500
          - 503
        error:
          $ref: '#/components/schemas/ErrorEnvelope/properties/error'
      allOf:
      - if:
          properties:
            status:
              const: failed
        then:
          required:
          - error
          properties:
            httpStatus:
              enum:
              - 404
              - 413
              - 500
              - 503
        else:
          not:
            required:
            - error
          properties:
            httpStatus:
              const: 200
      - if:
          properties:
            httpStatus:
              const: 404
        then:
          properties:
            error:
              properties:
                code:
                  enum:
                  - NOT_FOUND
      - if:
          properties:
            httpStatus:
              const: 413
        then:
          properties:
            error:
              properties:
                code:
                  enum:
                  - PERSISTENCE_TOO_LARGE
      - if:
          properties:
            httpStatus:
              const: 500
        then:
          properties:
            error:
              properties:
                code:
                  enum:
                  - PERSISTENCE_FAILED
      - if:
          properties:
            httpStatus:
              const: 503
        then:
          properties:
            error:
              properties:
                code:
                  enum:
                  - PERSISTENCE_BUSY
                  - PERSISTENCE_CLOSING
                  - PERSISTENCE_COMMITTED
                  - PERSISTENCE_UNAVAILABLE
    LibrarySharingBatchEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/LibrarySharingBatchItem'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'
    LibraryTagName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9][A-Za-z0-9-]{0,63}$
    LibraryTag:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/LibraryTagName'
    LibraryTagCreateRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/LibraryTagName'
    LibraryTagAssignmentRequest:
      type: object
      additionalProperties: false
      required:
      - tag
      - hashes
      properties:
        tag:
          $ref: '#/components/schemas/LibraryTagName'
        hashes:
          $ref: '#/components/schemas/LibraryHashSelection'
    LibraryTagBatchItem:
      type: object
      additionalProperties: false
      required:
      - hash
      - status
      - httpStatus
      properties:
        hash:
          type: string
          pattern: ^[0-9a-f]{32}$
        status:
          type: string
          enum:
          - accepted
          - unchanged
          - failed
        httpStatus:
          type: integer
          enum:
          - 200
          - 404
          - 500
        error:
          $ref: '#/components/schemas/ErrorEnvelope/properties/error'
      allOf:
      - if:
          properties:
            status:
              const: failed
        then:
          required:
          - error
          properties:
            httpStatus:
              enum:
              - 404
              - 500
        else:
          not:
            required:
            - error
          properties:
            httpStatus:
              const: 200
    CursorPageMeta:
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - nextCursor
      - hasMore
      properties:
        apiVersion:
          type: string
        nextCursor:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 512
        hasMore:
          type: boolean
        total:
          type: integer
          minimum: 0
      allOf:
      - if:
          properties:
            hasMore:
              const: false
        then:
          properties:
            nextCursor:
              type: 'null'
      - if:
          properties:
            hasMore:
              const: true
        then:
          properties:
