      required: [id, query, method, type, status, statusReason, resultCount]
      properties:
        id:
          type: string
        query:
          type: string
        method:
          type: string
          description: Resolved native search method.
          enum: [automatic, server, global, kad]
        type:
          type: string
          enum: ["", arc, audio, iso, image, pro, video, doc, emulecollection]
        status:
          type: string
          enum: [running, complete]
        statusReason:
          type: [string, "null"]
        resultCount:
          type: integer
          minimum: 0
    SearchEnvelope:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Search"
    Search:
      type: object
      unevaluatedProperties: false
      required: [id, query, method, type, status, statusReason, items]
      properties:
        id:
          type: string
        query:
          type: string
        method:
          type: string
          description: Resolved native search method.
          enum: [automatic, server, global, kad]
        type:
          type: string
          enum: ["", arc, audio, iso, image, pro, video, doc, emulecollection]
        status:
          type: string
          enum: [running, stopped, complete, error]
        statusReason:
          type: [string, "null"]
        items:
          type: array
          description: >
            Current native visible result snapshot for this page, bounded by the
            `offset` and `limit` query parameters. The search resource shares the
            common pagination fields (`total`/`offset`/`limit`). When
            `exactTotal=false`, `total` may be a lower-bound estimate; controllers
            should poll the resource and preserve eMule's stock eD2K/Kad search
            semantics.
          items:
            $ref: "#/components/schemas/SearchResult"
      allOf:
        - $ref: "#/components/schemas/Pagination"
    SearchCreateRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^(?=.*\S)[^\x00-\x08\x0E-\x1F\x7F-\x9F]*$'
        method:
          type: string
          description: >
            Requested native search method. automatic resolves from live network
            state: connected eD2K uses global, Kad-only uses kad, and offline
            searches are rejected as not connected.
          enum: [automatic, server, global, kad]
        type:
          type: string
          enum: ["", arc, audio, iso, image, pro, video, doc, emulecollection]
        minSizeBytes:
          type: integer
          minimum: 0
        maxSizeBytes:
          type: integer
          minimum: 0
        minAvailability:
          type: integer
          minimum: 0
          maximum: 1000000
        extension:
          type: string
    SearchResult:
      type: object
      additionalProperties: false
      required:
        - searchId
        - method
        - type
        - hash
        - name
        - sizeBytes
        - sources
        - completeSources
        - fileType
        - complete
        - knownType
        - directory
        - clientIp
        - clientPort
        - serverIp
        - serverPort
        - clientCount
        - serverCount
        - kadPublishInfo
        - rating
        - hasComment
        - spam
      properties:
        searchId:
          type: string
        method:
          type: string
          enum: [automatic, server, global, kad]
        type:
          type: string
          enum: ["", arc, audio, iso, image, pro, video, doc, emulecollection]
        hash:
          type: string
        name:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        sources:
          type: integer
          minimum: 0
        completeSources:
          type: integer
          minimum: 0
        fileType:
          type: string
          description: >
            Raw native file-type tag reported by the search result row. This is
            not constrained to the search request type enum and is not remapped.
        extension:
          type: string
        complete:
          type: boolean
        knownType:
          type: string
          enum: [shared, downloading, downloaded, cancelled, unknown, undetermined]
        directory:
          type:
            - string
            - "null"
        clientIp:
          type: string
        clientPort:
          type: integer
          minimum: 0
          maximum: 65535
        serverIp:
          type: string
        serverPort:
          type: integer
          minimum: 0
          maximum: 65535
        clientCount:
          type: integer
          minimum: 0
        serverCount:
          type: integer
          minimum: 0
        kadPublishInfo:
          type: integer
          minimum: 0
        rating:
          type: integer
          minimum: 0
        hasComment:
          type: boolean
        spam:
          type: boolean
        evidence:
          description: Present unless the caller sets `includeEvidence=false`.
          $ref: "#/components/schemas/SearchResultEvidence"
